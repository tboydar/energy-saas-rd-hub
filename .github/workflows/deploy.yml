name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read # 版號要查這個流程今天跑了幾次

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type-check and unit tests
        run: bun run check
      # 版號 v<台灣日期>.<當天第幾次 CI> 在建置時算出來（scripts/app-version.ts）
      - name: Build
        run: bun run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Show version
        run: |
          VERSION=$(grep -o 'name="app-version" content="[^"]*"' dist/index.html | sed -E 's/.*content="([^"]*)"/\1/')
          echo "Version: $VERSION"
          echo "### $VERSION" >> "$GITHUB_STEP_SUMMARY"
      - name: Install the browser for E2E tests
        run: bunx playwright install --with-deps chromium
      - name: E2E tests
        run: bun run test:e2e
      - name: Upload E2E traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
